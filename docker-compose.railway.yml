# Production stack for Railway (or `docker compose -f docker-compose.railway.yml up --build`).
# Browser hits `web` only; Next.js proxies `/backend/*` to the API on the private network.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mira}
      POSTGRES_DB: mira
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mira -d mira"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["/bin/sh", "/app/start.sh"]
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://mira:${POSTGRES_PASSWORD:-mira}@db:5432/mira
      REDIS_URL: redis://redis:6379
      AUDIO_DIR: /data/audio
      TTS_DIR: /data/tts
      API_CORS_ORIGINS: "*"
      RERANK_ENABLED: "false"
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      VOYAGE_EMBED_MODEL: ${VOYAGE_EMBED_MODEL:-voyage-context-4}
      VOYAGE_EMBED_DIM: ${VOYAGE_EMBED_DIM:-1024}
      ANTHROPIC_ROUTE_MODEL: ${ANTHROPIC_ROUTE_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_GROUND_MODEL: ${ANTHROPIC_GROUND_MODEL:-claude-sonnet-4-5-20250929}
    volumes:
      - mira-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: /backend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  mira-data:
