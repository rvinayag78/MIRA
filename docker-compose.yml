services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: mira
      POSTGRES_DB: mira
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mira -d mira"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mira:mira@db:5432/mira
      REDIS_URL: redis://redis:6379
      AUDIO_DIR: /data/audio
      TTS_DIR: /data/tts
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./data/audio:/data/audio
      - ./data/tts:/data/tts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: arq app.workers.settings.WorkerSettings
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mira:mira@db:5432/mira
      REDIS_URL: redis://redis:6379
      AUDIO_DIR: /data/audio
      TTS_DIR: /data/tts
    volumes:
      - ./apps/api:/app
      - ./data/audio:/data/audio
      - ./data/tts:/data/tts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pgdata: