name: eval-gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest evals/test_metrics.py evals/test_chunking.py evals/test_generate_parse.py -q
      - name: Offline Recall@k gate
        run: python -m evals.run_gate
        env:
          RERANK_ENABLED: "false"
