[project]
name = "mira-api"
version = "0.1.0"
description = "MIRA memory + voice clone demo API"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.6.0",
  "asyncpg>=0.30.0",
  "httpx>=0.28.0",
  "arq>=0.26.1",
  "anthropic>=0.40.0",
  "assemblyai>=0.35.0",
  "numpy>=2.0.0",
  "eval_type_backport>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "evals*"]

[tool.setuptools.package-data]
app = ["db/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["evals"]

[tool.ruff]
line-length = 100